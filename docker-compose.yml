services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wallet
      DB_USER: wallet
      DB_PASSWORD: wallet
      PORT: 8080
      # Explicit here so the knob is visible, even though it matches the default. In a
      # deployed environment this MUST be a real secret — see .env.example.
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-local-dev-secret-not-for-production}
    ports:
      - "8080:8080"

volumes:
  wallet-postgres-data:
